<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Valentine Faith</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #ffe6e6;
            color: #d63384;
            margin: 0;
            padding: 20px;
        }
        #front-page {
            display: block;
        }
        #gallery {
            display: none;
        }
        #message-page {
            display: none;
        }
        img {
            max-width: 300px;
            height: auto;
            border-radius: 10px;
            margin: 10px;
        }
        button {
            background-color: #4a0f4d;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px;
        }
        button:hover {
            background-color: #b14e83;
        }
        .gallery img {
            cursor: pointer;
        }
        #current-message {
            font-size: 20px;
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            margin: 20px auto;
            max-width: 400px;
        }
    </style>
</head>
<body>
    <div id="front-page">
        <h1>Happy Valentine's, My Faith!</h1>
        <img src="alaya.jpg" alt="Her Picture">
        <p>me muna valentine mo hehew </p>
        <button onclick="showGallery()">YES!</button>
    </div>

    <div id="gallery">
        <h2>Here are some memories of us:</h2>
        <h4>pindot mo yung picture baby ko HAHAHA</h4>
        <img class="gallery" src="jensen.jpg" alt="Photo 1" onclick="showMessage(1)">
        <img class="gallery" src="jc.jpg" alt="Photo 2" onclick="showMessage(2)">
        <img class="gallery" src="lilim.jpg" alt="Photo 3" onclick="showMessage(3)">
        <img class="gallery" src="sb.jpg" alt="Photo 4" onclick="showMessage(4)">
        <img class="gallery" src="photob.jpg" alt="Photo 4" onclick="showMessage(5)">
        <img class="gallery" src="street.jpg" alt="Photo 4" onclick="showMessage(6)">
        <img class="gallery" src="vicencio.jpg" alt="Photo 4" onclick="showMessage(7)">
        <img class="gallery" src="timelapse.jpg" alt="Photo 4" onclick="showMessage(8)">
    </div>

    <div id="message-page">
        <h2>What I Want to Tell You</h2>
        <div id="current-message"></div>
        <button onclick="backToGallery()">Balik kana baby!</button>
    </div>

    <script>
        const messages = [
            "This is the pic when we had coffee with our sister haha We didn't really enjoy the teasing bcoz it seemed like we were playing it safe HAHA but it's still memorable parin naman. (diman lang nag tagal e HAHAHAH)",
            "This was when we had coffee at JC after eating samgy, then we ended up walking so far because no one could pick us up HAHA, but it’s okay, no choice HAHAHA At least we have the place to ourselves naman.",
            "This was one of our most memorable moments. When we went to Lilim because we planned it so much, we still ended up getting lost hahaha. After hours of searching, we finally found it—but there wasn’t even a good spot available😆",
            "We look so cute here naman oh. We didn’t want to go to SB at first, but in the end we still had coffee there hahaha. Thanks again for the treat.mwuah! I think I’m still tasting the SB hahahha.",
            "Since we super pagod na from that stressful search sa Lilim, we ended up having fun pa sa photobooth hahaha. Super jowa feels talaga hahaha. pero super fun naman dyan love ko sm yung moments natin dyan HAHAAHAH sigaw yarn",
            "I remember that time I opened up to you about my ex. You really eased my mind—not just the food and coffee that helped me de-stress, but also our catch-up. Thank you always for listening to my rants, love u sm❤️",
            "This was the time Lord answered your long-time prayer. That’s when you got work! Yieee, super happy dito hahaha.",
            "Hello, Faith! I know you don’t have a Valentine haha, so let’s just celebrate ourselves instead HAHA kidding aside. I really want to thank you not just for being my sister in Christ, but also my best friend! Thank you for always being there for me, for listening to my problems, and even though we both have our own struggles, you still make time to help me. I’m truly grateful to the Lord for bringing you into my life not just to meet you, but I know He gave you to me, and I feel so blessed because of that. I always pray for you sister that we both achieve our personal dreams and our dreams together. I’m also thankful that you’ve been one of the Lord’s instruments in strengthening my faith. I pray that our faith continues to grow, and that our relationship with the Lord becomes even stronger. Always remember that I’m here by your side. Take care, stay positive, and I love you, my coffee buddy!❤️"
        ];

        function showGallery() {
            document.getElementById('front-page').style.display = 'none';
            document.getElementById('gallery').style.display = 'block';
            document.getElementById('message-page').style.display = 'none';
        }

        function showMessage(num) {
            document.getElementById('gallery').style.display = 'none';
            document.getElementById('message-page').style.display = 'block';
            document.getElementById('current-message').innerHTML = messages[num - 1];
        }

        function backToGallery() {
            document.getElementById('message-page').style.display = 'none';
            document.getElementById('gallery').style.display = 'block';
        }
    </script>
</body>
</html>
